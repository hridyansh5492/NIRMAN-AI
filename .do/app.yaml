name: nirman-ai
region: blr
services:
  - name: nirman-unified
    github:
      branch: main
      deploy_on_push: true
      repo: vipuljoshi0001/NirmanAi
    dockerfilePath: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xs
    envs:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        type: SECRET
        scope: RUN_TIME
      - key: OPENROUTER_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: OPENROUTER_MODEL
        value: "google/gemini-2.5-flash"
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
